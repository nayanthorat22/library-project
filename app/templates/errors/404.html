{% extends "base.html" %}

{% block title %}Page Not Found - 404{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <i class="bi bi-question-circle text-warning display-1 mb-3"></i>
        <h1 class="fw-bold">404 - Page Not Found</h1>
        <p class="lead text-muted mb-4">The page or book you are looking for does not exist or has been moved.</p>
        <a href="{{ url_for('main.catalog') }}" class="btn btn-primary px-4">Browse Catalog</a>
    </div>
</div>
{% endblock %}
